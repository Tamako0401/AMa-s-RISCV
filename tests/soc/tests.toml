[[test]]
tb = "soc_tb.sv"
params = [{ VIDEO_720P = 0 }, { VIDEO_720P = 1 }]
rtl = "rtl/soc.f"
runs = [
  { program = ["tests/soc/soc_smoke.S"], plusargs = ["+stores=19"] },
  { program = ["tests/soc/soc_data.S"], plusargs = ["+stores=1"] },
  { program = ["tests/soc/soc_spi.S"], plusargs = ["+stores=17", "+check_spi"] },
  { program = ["tests/soc/soc_uart.S"], plusargs = ["+stores=7", "+check_uart"] },
  { program = ["tests/cpu/loaduse.S"], plusargs = ["+stores=2"] },
  { program = ["tests/cpu/ras.S"], plusargs = ["+stores=36"] },
]

[[test]]
tb = "lcd_tb.sv"
params = [{ VIDEO_720P = 0 }, { VIDEO_720P = 1 }]
rtl = "rtl/soc.f"
extra = ["tests/soc/st7789_model.sv"]
runs = [{ app = "selftest" }]

[[test]]
tb = "reset_tb.sv"
params = [{ VIDEO_720P = 0 }, { VIDEO_720P = 1 }]
rtl = "rtl/soc.f"
runs = [{ program = ["sw/startup.S", "tests/soc/reset_check.c"], link = "sw/link.ld", ram_init = false }]

[[test]]
tb = "snake_tb.sv"
params = [{ VIDEO_720P = 0 }, { VIDEO_720P = 1 }]
rtl = "rtl/soc.f"
extra = ["tests/soc/st7789_model.sv"]
runs = [{ app = "snake", defines = ["-DSNAKE_STEP_CYCLES=1000000"] }]

[[test]]
tb = "coremark_tb.sv"
params = [{ VIDEO_720P = 0 }, { VIDEO_720P = 1 }]
rtl = "rtl/soc.f"
runs = [{ app = "coremark", defines = ["-DITERATIONS=3", "-DMIN_SCORE=650"] }]

[[test]]
tb = "video_tb.sv"
params = [{ VIDEO_720P = 0 }, { VIDEO_720P = 1 }]
rtl = "rtl/soc.f"
extra = ["tests/soc/video_sink.sv", "tests/soc/video_source.sv"]
runs = [{ app = "video_demo" }]

# 新显示的 SoC 级比对 (DISPLAY_NEW=1 在 tb 里写死): CPU 走总线重放 refmodel 的场景再逐点比对。
# 场景选小窗关的 (tb 没接视觉输入流); touhou/fruit 要小窗, 以后接 video_source 再加。
[[test]]
tb = "display_tb.sv"
rtl = "rtl/soc.f"
extra = ["tests/soc/video_sink.sv"]
runs = [
  { prepare = ["game/tools/refmodel.py", "export", "--scene", "bg", "--soc", "-o", "{out}"], program = ["tests/cpu/start.S", "tests/soc/display_check.c", "{out}/script.c"], plusargs = ["+data={out}"] },
  { prepare = ["game/tools/refmodel.py", "export", "--scene", "sprites", "--soc", "-o", "{out}"], program = ["tests/cpu/start.S", "tests/soc/display_check.c", "{out}/script.c"], plusargs = ["+data={out}"] },
  { prepare = ["game/tools/refmodel.py", "export", "--scene", "affine", "--soc", "-o", "{out}"], program = ["tests/cpu/start.S", "tests/soc/display_check.c", "{out}/script.c"], plusargs = ["+data={out}"] },
  { prepare = ["game/tools/refmodel.py", "export", "--scene", "overflow", "--soc", "-o", "{out}"], program = ["tests/cpu/start.S", "tests/soc/display_check.c", "{out}/script.c"], plusargs = ["+data={out}"] },
]

[[test]]
tb = "soc_tb.sv"
rtl = "rtl/soc.f"
# uart2_check: 第二个串口经 GPIO 矩阵接到 J8_3 上回环收发 (+loopback: 测试台把输出脚的电平送回输入);
# audio_check: 声音外设的寄存器和 I2S 三根线经矩阵出引脚
runs = [
  { program = ["tests/cpu/start.S", "tests/soc/nn_check.c"], plusargs = ["+cycles=4000000"] },
  { program = ["tests/cpu/start.S", "tests/soc/uart2_check.c", "sw/drivers/uart.c"], plusargs = ["+loopback"] },
  { program = ["tests/cpu/start.S", "tests/soc/audio_check.c"], plusargs = ["+loopback", "+check_audio"] },
]

# 流水线效率: 计时区间内 CPI 和每拍归因 (仿真里的 ILA), 结果见 [result] 行; 加 +trace=<文件> 导出波形 CSV
[[test]]
tb = "coremark_perf_tb.sv"
params = [{ VIDEO_720P = 0 }]
rtl = "rtl/soc.f"
runs = [{ app = "coremark", defines = ["-DITERATIONS=3", "-DMIN_SCORE=650"] }]
