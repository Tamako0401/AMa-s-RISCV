name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 安装工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator gcc-riscv64-unknown-elf python3
      - uses: astral-sh/setup-uv@v6
      - run: ./ama test
      - run: cd third_party/coremark && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs
          path: build/test/
